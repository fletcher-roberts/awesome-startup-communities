name: Link check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 6 --max-retries 4 --retry-wait-time 5 --timeout 45
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999
            README.md llms.txt
          fail: true
